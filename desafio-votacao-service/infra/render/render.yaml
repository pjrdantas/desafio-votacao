# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: desafio-votacao-service
    runtime: docker
    plan: free
    region: virginia
    rootDir: desafio-votacao-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: APP_ENV
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: desafio-votacao-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: desafio-votacao-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: desafio-votacao-db
          property: password
      - key: DB_POOL_SIZE
        value: "5"
      - key: JWT_KEY_STORE_PATH
        value: /tmp/desafio-votacao/jwt.jwk
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: CPF_FAKE_MODO
        value: apto
      - key: MOBILE_BASE_URL
        fromService:
          type: web
          name: desafio-votacao-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"

databases:
  - name: desafio-votacao-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: votacao
    user: votacao
    ipAllowList: []
