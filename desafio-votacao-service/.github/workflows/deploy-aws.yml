name: Publicar backend na AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B -ntp verify
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Construir e enviar imagem imutável
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          docker build --target app -t "$REPOSITORY:${GITHUB_SHA}" .
          docker push "$REPOSITORY:${GITHUB_SHA}"
      - name: Registrar revisão da tarefa
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
          TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY }}
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > current-task.json
          jq --arg IMAGE "$REPOSITORY:${GITHUB_SHA}" '
            .containerDefinitions[0].image = $IMAGE |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' current-task.json > next-task.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://next-task.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "TASK_ARN=$TASK_ARN" >> "$GITHUB_ENV"
      - name: Atualizar serviço
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "${{ vars.ECS_SERVICE }}" --task-definition "$TASK_ARN"
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_SERVICE }}"