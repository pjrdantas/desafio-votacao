name: desafio-votacao

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: votacao
      POSTGRES_USER: votacao
      POSTGRES_PASSWORD: ${DB_PASSWORD:-votacao}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votacao -d votacao"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/votacao
      DB_USERNAME: votacao
      DB_PASSWORD: ${DB_PASSWORD:-votacao}
      JWT_KEY_STORE_PATH: /app/keys/jwt.jwk
      JWT_ISSUER: ${JWT_ISSUER:-urn:desafio-votacao-service}
      JWT_ACCESS_DURATION: ${JWT_ACCESS_DURATION:-10m}
      JWT_REFRESH_DURATION: ${JWT_REFRESH_DURATION:-8h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CPF_FAKE_MODO: ${CPF_FAKE_MODO:-aleatorio}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-120}
      MOBILE_BASE_URL: ${MOBILE_BASE_URL:-http://localhost:8080}
    volumes:
      - jwt-keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
volumes:
  postgres-data:

  jwt-keys:
