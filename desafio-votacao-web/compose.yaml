name: desafio-votacao-web
services:
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    environment:
      PORT: 80
      API_SCHEME: ${API_SCHEME:-http}
      API_HOST: ${API_HOST:-host.docker.internal}
      API_PORT: ${API_PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
