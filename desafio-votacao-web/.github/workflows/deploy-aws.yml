name: Publicar frontend na AWS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publicar arquivos estáticos
        env:
          BUCKET: ${{ vars.WEB_BUCKET }}
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION }}
        run: |
          BUILD=dist/desafio-votacao-web/browser
          aws s3 sync "$BUILD" "s3://$BUCKET" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$BUILD/index.html" "s3://$BUCKET/index.html" --cache-control no-cache --content-type text/html
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*'