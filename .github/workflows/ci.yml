name: Validar projetos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-votacao-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: desafio-votacao-service/pom.xml
      - run: sh mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            desafio-votacao-service/target/surefire-reports/
            desafio-votacao-service/target/failsafe-reports/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-votacao-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: desafio-votacao-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
